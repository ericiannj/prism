<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism — temporarily offline</title>
    <style>
      :root {
        --background: #0d0d14;
        --surface: #15151f;
        --border: #2a2a3d;
        --text-primary: #f4f4f8;
        --text-secondary: #a1a1c2;
        --accent-text: #a78bfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--background);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 480px;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      a {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Prism is temporarily offline</h1>
      <p>The backend is being migrated to a serverless architecture.</p>
      <p>Source code: <a href="https://github.com/ericiannj/prism">github.com/ericiannj/prism</a></p>
    </main>
  </body>
</html>
